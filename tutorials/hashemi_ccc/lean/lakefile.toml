name = "RequestProject"
defaultTargets = ["RequestProject"]
# the Metal bridge (tutorials/hashemi_ccc/bridge): Lean programs that call GPU kernels link it
moreLinkArgs = ["-L/Users/faezs/ARTIST-compliant/tutorials/hashemi_ccc/bridge", "-lmetal_bridge", "-Wl,-rpath,/Users/faezs/ARTIST-compliant/tutorials/hashemi_ccc/bridge"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.28.0"

[[lean_lib]]
name = "RequestProject"
globs = ["RequestProject.+"]

# `lake exe frontier < designs.json`: the proved Pareto frontier (RequestProject/Pareto.lean) as a program
[[lean_exe]]
name = "frontier"
root = "Frontier"

# `lake exe bridge_smoke`: a two-line kernel through the Metal bridge
[[lean_exe]]
name = "bridge_smoke"
root = "BridgeSmoke"

# `lake exe trace_check`: the optics theorems measured on the GPU (his dish's generated trace, the tandoor's trace)
[[lean_exe]]
name = "trace_check"
root = "TraceCheck"

# `lake exe machine_scale <a> [out.json]`: his machine derived at another reflector size
# (RequestProject/HashemiScale.lean), with a verdict per constraint
[[lean_exe]]
name = "machine_scale"
root = "MachineScale"

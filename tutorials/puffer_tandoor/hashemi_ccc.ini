[base]
package = tandoor
env_name = puffer_hashemi_ccc
policy_name = Policy
rnn_name = Recurrent

[vec]
backend = Serial
num_envs = 1

[env]
; Hashemi's machine, its physics the megakernel compiled from Hashemi.lean
; (tutorials/hashemi_ccc/hashemi_env.py); the site is Quetta, the day drawn per episode
num_agents = 4096
lat = 30.2
day_random = 1
dt = 15.0
device = mps
full_obs = 0

[policy]
hidden_size = 128

[rnn]
input_size = 128
hidden_size = 128

[train]
device = mps
total_timesteps = 100_000_000
learning_rate = 0.003
gamma = 0.99
gae_lambda = 0.95
ent_coef = 0.001
minibatch_size = 16384
bptt_horizon = 64
checkpoint_interval = 20
compile = False

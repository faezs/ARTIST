[base]
package = tandoor_ccc
env_name = puffer_hashemi_ccc
policy_name = Policy
rnn_name = Recurrent

[vec]
backend = Serial
num_envs = 1

[env]
; the tandoor with his concentrator: the pose and the power into the pot from Hashemi.lean
; compiled (tutorials/hashemi_ccc/hashemi_tandoor_env.py); everything else this file's tandoor
gpu = 1
day_random = 1
lat_random = 1
device = mps
n_rays = 512
num_agents = 8192
g_orbit = 4 
n_zones = 5
zone_c = 0.4
deck_h = 4.0
nurbs = 1
wide_shutter = 1
warm_frac = 0.0
wall_obs = 1
flare_ratio = 1.4
flare_reflect = 0.6
beta_dev = 0.0
beta_cap_z = 7.6
silvered = 1
duct_nozzle = 2
spot_bread = 1
elbow_aim = 1
load_ctrl = 1
roti_kj = 130.0
bread_area = 0.12
loaves_per_load = 8
reward_div = 75.0
sticky_k = 1
receiver = tri
r_m4 = 1.3
night_carry = 1
r_duct = 0.55
wall = ifb
insulation = 1
cut_penalty = 75.0
lost_deg = 5.0
; the policy learns to point: the light arriving at the receiver (the spec's p_in) paid per step in roti
; units, capture_shaping x 5 raw per roti's worth - non-negative, so a cut never pays; pointing_shaping
; is potential-based now (the parent has its own tracking term) and off. See hashemi_tandoor_env.py
; reward_div, capture_shaping, roti_kj (and the parent's 5 raw per roti) are INPUTS of the printed
; reward morphism `rewardStep` (HashemiReward.lean -> hashemi_reward.metal): these values are handed
; to the kernel, and reward_div is applied once, inside it.
capture_shaping = 0.2
pointing_shaping = 0.0
; the machine's receiver: oil (the coil, the loop, the exchanger) or beam (the hyperboloid beam-down through the slot; beam_slot etc.)
machine_receiver = oil
; the coil heats the first oil_nodes belt slots uniformly. 8 = the whole wall band: the follower's belt
; reaches only 383 K on day 172 and NOTHING bakes (the coil delivers ~1.1 kW to a pit that loses more at
; 400 K); 2 = a hot plate under two slots: 51 a day on day 172, 44 on day 80 (measured 2026-09-19)
oil_nodes = 2
; THE OIL LOOP IS A LOOP (HashemiOil.lean; hashemi_ccc/README.md "## The oil loop, realistically").
; The fluid is Therminol 66 with its own property fits and its own two limits (345 C bulk, 375 C
; film); the pump is the parent's pinned head 0 through `pumpOf`, and the flow sets the Reynolds
; number, the film coefficient, the exchanger's UA, the pipe's delay, the film temperature and the
; pump's own power.  Every parameter of the loop lives in hashemi_ccc/hashemi_env_kernel.py
; (LOOP_PARAMS), because they are INPUTS of the compiled kernel, not knobs of this file; the two
; PRICES are here, because they are the trainer's, not the physics'.
;   pump_price: an electrical joule priced exactly as capture_shaping prices a thermal one (1.0 is
;   the most favourable accounting a pump can get - and the pump still does not fit on his 5 W
;   panel: `PumpWithinBudget` FAILS at 8 W, which is a finding, not a bug).
;   deg_price: rotis' reward per kelvin-second the FILM spends over 375 C.  5e-7 costs about one
;   roti for a day pinned 50 K over.  The datasheet gives a limit, not a rate: see the Lean.
pump_price = 1.0
deg_price = 5.0e-7
dish_half = 2.0
lost_shaping = 0.0
enc_clamp = 6.0

[policy]
; 128 (from 256): the learn step dominated the 8192-agent run (Learn 11 s vs Env 5 s per epoch at 571K params);
; the LSTM is 4 h (2h) of it, so halving h cuts the weights ~4x
hidden_size = 128

[rnn]
input_size = 128
hidden_size = 128

[train]
device = mps
optimizer = muon
total_timesteps = 1500_000_000
anneal_lr = True

learning_rate = 0.003
gamma = 0.995
gae_lambda = 0.923
adam_beta1 = 0.98
ent_coef = 0
clip_coef = 0.1
minibatch_size = 65536
bptt_horizon = 512
max_grad_norm = 3.25
checkpoint_interval = 20
compile = False
prio_alpha = 0.7

[sweep]
method = Protein
metric = rotis_per_hour
goal = maximize
downsample = 10

; ONE architecture dim: the GP samples the encoder width; rnn
; input_size and hidden_size are TIED to it by the sweep runner
; (modal_sweep.run_sweep DERIVED table) because the matmuls demand
; it - encoder out feeds LSTM in, LSTM out feeds the decoder.
; (This replaces the 'distribution = sweep.policy.hidden_size'
; reference syntax, which pufferlib's parser cannot express.)
; pow2 up to 2048: a 16384-wide LSTM probe would run ~1e2 slower
; than it learns - raise the cap deliberately, not by typo.
[sweep.policy.hidden_size]
distribution = uniform_pow2
min = 64
max = 2048
mean = 256
scale = auto

; PIN, do not delete: default.ini SWEEPS vec.num_envs, and the fast
; collect (plus the 8192-tandoors-in-one-env design) requires ONE
; native vec env. min == max = pinned (the sweep patch skips it).
[sweep.vec.num_envs]
distribution = uniform_pow2
min = 1
max = 1
mean = 1
scale = auto

; probe-length mean halved: everything decisive locally (climb,
; plateau, walk-onset) happens by ~300M; longer probes buy little
; ranking signal and n_rays=512 makes each step pricier than the
; 64-ray sweeps this budget was set for
[sweep.train.total_timesteps]
distribution = log_normal
min = 3e8
max = 3e9
mean = 5e8
scale = time

; lr prior recentered for MUON (fixed-norm updates: lr IS the step
; size). Proven points: 0.01 blitzes bootstrap but walks off the
; plateau; 0.005 climbs tamely (kl 0.003). Mean sits between.
[sweep.train.learning_rate]
distribution = log_normal
min = 0.001
max = 0.02
mean = 0.005
scale = 0.5

; ent recentered on the no-bonus regime: every sweep run at
; ent>=0.01 scored zero; the local 110/day climbs ran ent 0-1e-5.
; With muon at the plateau an entropy bonus is a decommitment
; force (it wins tugs-of-war against zero-mean advantage noise).
[sweep.train.ent_coef]
distribution = log_normal
min = 0.000001
max = 0.003
mean = 0.00003
scale = auto

[sweep.train.gamma]
distribution = logit_normal
min = 0.99
max = 0.9995
mean = 0.995
scale = auto

[sweep.train.gae_lambda]
distribution = logit_normal
min = 0.90
max = 0.98
mean = 0.928
scale = auto

; bptt mean moved to the measured winner: the only sweep dim with a
; clean 2x effect (runs 10/11, bptt=512, doubled every bptt<=256
; run), and the local 110/day config trains at 512.
[sweep.train.bptt_horizon]
distribution = uniform_pow2
min = 128
max = 1024
mean = 512
scale = auto

; NEW: engagement latch period (env). 0/off is known-dead (cooks
; vanish from sampled data); the local proven point is 8. Sweep the
; commitment-vs-reaction tradeoff around it.
[sweep.env.sticky_k]
distribution = uniform_pow2
min = 4
max = 32
mean = 8
scale = auto

; ---- PINS: default.ini silently sweeps ALL of these; their sweep
; centers are NOT our proven config (ent 0.01 vs 0.0029 pinned
; entropy at the ceiling for 780M steps; prio_beta0 0.85 vs 0.2,
; grad norm 1.0 vs 3.25, adam retuned). min == max = pinned (the
; sweep patch skips it and the ini base value holds).
[sweep.train.minibatch_size]
distribution = uniform
min = 65536
max = 65536
mean = 65536
scale = auto

[sweep.train.vtrace_rho_clip]
distribution = uniform
min = 1.0
max = 1.0
mean = 1.0
scale = auto

[sweep.train.vtrace_c_clip]
distribution = uniform
min = 1.0
max = 1.0
mean = 1.0
scale = auto

; UNPINNED: the per-epoch movement fence is now a first-class
; stability knob (muon walks at the plateau; the fence caps each
; epoch's drift). Local runs: 0.2 yanked, 0.1 climbed orderly.
[sweep.train.clip_coef]
distribution = logit_normal
min = 0.05
max = 0.3
mean = 0.1
scale = auto

[sweep.train.vf_clip_coef]
distribution = uniform
min = 0.2
max = 0.2
mean = 0.2
scale = auto

[sweep.train.vf_coef]
distribution = uniform
min = 2.0
max = 2.0
mean = 2.0
scale = auto

[sweep.train.max_grad_norm]
distribution = uniform
min = 3.25
max = 3.25
mean = 3.25
scale = auto

; muon momentum EMA (heavyball reuses the adam beta names): pinned
; at the local operating point - longer EMA cancels more plateau
; noise before orthogonalization
[sweep.train.adam_beta1]
distribution = uniform
min = 0.98
max = 0.98
mean = 0.98
scale = auto

[sweep.train.adam_beta2]
distribution = uniform
min = 0.999
max = 0.999
mean = 0.999
scale = auto

[sweep.train.adam_eps]
distribution = uniform
min = 1e-12
max = 1e-12
mean = 1e-12
scale = auto

; UNPINNED, centered LOW: prio resamples the same tail segments all
; epoch, giving plateau noise a consistent direction that survives
; muon's momentum and becomes a full-norm step - the measured drift
; that killed three local runs. alpha=0 (uniform minibatches) is
; the local operating point; let the GP price the tradeoff.
[sweep.train.prio_alpha]
distribution = uniform
min = 0.0
max = 0.8
mean = 0.2
scale = auto

[sweep.train.prio_beta0]
distribution = uniform
min = 0.2
max = 0.2
mean = 0.2
scale = auto


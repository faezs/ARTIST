[base]
package = tandoor
env_name = puffer_electroform
policy_name = Policy
rnn_name = Recurrent

[vec]
backend = Serial
num_envs = 1

[env]
num_agents = 4096
divided = 1

[policy]
hidden_size = 256

[rnn]
input_size = 256
hidden_size = 256

[train]
device = mps
optimizer = muon
total_timesteps = 500_000_000
learning_rate = 0.01
adam_eps = 1e-8
gamma = 0.9995
gae_lambda = 0.95
batch_size = auto
minibatch_size = 65536
bptt_horizon = 128
checkpoint_interval = 200
compile = False

[base]
package = tandoor
env_name = puffer_shed
policy_name = Policy
rnn_name = Recurrent

[vec]
backend = Serial
num_envs = 1

[env]
num_agents = 512
n_zones = 5
render_mode = human
nurbs = 0
wide_shutter = 1
warm_frac = 0.5
flare_ratio = 1.4
flare_reflect = 0.6

[policy]
hidden_size = 128

[rnn]
input_size = 128
hidden_size = 128

[train]
device = mps
optimizer = adam
total_timesteps = 12_000_000
learning_rate = 0.002
adam_eps = 1e-8
gamma = 0.9995
gae_lambda = 0.95
batch_size = auto
minibatch_size = 8192
bptt_horizon = 256
checkpoint_interval = 200
compile = False

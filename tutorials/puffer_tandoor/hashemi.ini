[base]
package = tandoor
env_name = puffer_hashemi
policy_name = Policy
rnn_name = Recurrent

[vec]
backend = Serial
num_envs = 1

[env]
day_random = 1
device = mps
n_rays = 16
num_agents = 16384
n_zones = 5
nurbs = 0
wide_shutter = 1
warm_frac = 0.2
flare_ratio = 1.4
flare_reflect = 0.6

[policy]
hidden_size = 256

[rnn]
input_size = 256
hidden_size = 256

[train]
device = mps
optimizer = muon
total_timesteps = 2000_000_000
learning_rate = 0.0003
adam_eps = 1e-8
gamma = 0.9995
gae_lambda = 0.95
batch_size = auto
minibatch_size = 8192
bptt_horizon = 256
checkpoint_interval = 200
compile = False

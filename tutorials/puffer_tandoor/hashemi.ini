[base]
package = tandoor
env_name = puffer_hashemi
policy_name = Policy
rnn_name = Recurrent

[vec]
backend = Serial
num_envs = 1

[env]
gpu = 1
day_random = 1
lat_random = 1
device = mps
n_rays = 64
num_agents = 8192
n_zones = 5
nurbs = 0
wide_shutter = 1
warm_frac = 0.8
wall_obs = 1
flare_ratio = 1.4
flare_reflect = 0.6
beta_dev = 36.0
beta_cap_z = 10.6
silvered = 1
duct_nozzle = 2
spot_bread = 1
elbow_aim = 1
roti_kj = 130.0
bread_area = 0.12
loaves_per_load = 9

[policy]
hidden_size = 256

[rnn]
input_size = 256
hidden_size = 256

[train]
device = mps
optimizer = muon
total_timesteps = 2000_000_000
anneal_lr = True
learning_rate = 0.0119
gamma = 0.99434
gae_lambda = 0.928
ent_coef = 0.0029
minibatch_size = 65536
bptt_horizon = 128
max_grad_norm = 3.25
checkpoint_interval = 200
compile = False

[sweep]
method = Protein
metric = rotis_per_day
goal = maximize
downsample = 10

; native vec env: 8192 tandoors inside ONE env - never fork more
[sweep.vec.num_envs]
distribution = uniform_pow2
min = 1
max = 1
mean = 1
scale = auto

[sweep.train.total_timesteps]
distribution = log_normal
min = 1e8
max = 2e9
mean = 3e8
scale = time

[sweep.train.learning_rate]
distribution = log_normal
min = 0.002
max = 0.1
mean = 0.02
scale = 0.5

[sweep.train.ent_coef]
distribution = log_normal
min = 0.0001
max = 0.1
mean = 0.01
scale = auto

[sweep.train.gamma]
distribution = logit_normal
min = 0.99
max = 0.9995
mean = 0.996
scale = auto

[sweep.train.gae_lambda]
distribution = logit_normal
min = 0.90
max = 0.98
mean = 0.95
scale = auto

[sweep.train.bptt_horizon]
distribution = uniform_pow2
min = 64
max = 256
mean = 128
scale = auto

[sweep.train.minibatch_size]
distribution = uniform_pow2
min = 32768
max = 262144
mean = 131072
scale = auto

; pinned per Suarez: never tune clipping ("on rails then diverges"),
; and the muon-wrapped adam moments are noise dimensions for Protein
[sweep.train.clip_coef]
distribution = uniform
min = 0.2
max = 0.2
mean = 0.2
scale = auto

[sweep.train.vf_clip_coef]
distribution = uniform
min = 0.2
max = 0.2
mean = 0.2
scale = auto

[sweep.train.vtrace_rho_clip]
distribution = uniform
min = 1.0
max = 1.0
mean = 1.0
scale = auto

[sweep.train.vtrace_c_clip]
distribution = uniform
min = 1.0
max = 1.0
mean = 1.0
scale = auto

[sweep.train.adam_beta1]
distribution = uniform
min = 0.95
max = 0.95
mean = 0.95
scale = auto

[sweep.train.adam_beta2]
distribution = uniform
min = 0.999
max = 0.999
mean = 0.999
scale = auto

[sweep.train.adam_eps]
distribution = log_normal
min = 1e-12
max = 1e-12
mean = 1e-12
scale = auto

; pinned: the default space bottoms at 0.0 and clip_grad_norm_(p, 0)
; ZEROES all gradients - a dead probe by construction
[sweep.train.max_grad_norm]
distribution = uniform
min = 1.5
max = 1.5
mean = 1.5
scale = auto

; pinned for sweep-seeding: these two were never printed in historical
; run logs, so seeded observation vectors must not include them
[sweep.train.prio_alpha]
distribution = uniform
min = 0.85
max = 0.85
mean = 0.85
scale = auto

[sweep.train.prio_beta0]
distribution = uniform
min = 0.6
max = 0.6
mean = 0.6
scale = auto

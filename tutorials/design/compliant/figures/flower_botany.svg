<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 810" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="12.5">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs>
<rect width="960" height="810" fill="#ffffff"/>
<rect x="0" y="560" width="960" height="250" fill="#efe6d5"/>
<line x1="0" y1="560" x2="960" y2="560" stroke="#8b6b3e" stroke-width="2"/>
<g transform="translate(150,0)">
<!-- side view, scale 60 px per metre, sun at el 60 to the upper right; F at (400,180); vertex 4 m down the axis at (280,388) -->
<!-- sun and incoming light along s = (0.5,-0.866) -->
<circle cx="640" cy="60" r="26" fill="#f6ad55"/>
<g stroke="#f6ad55" stroke-width="2.2">
  <line x1="330" y1="82" x2="190" y2="325"/><line x1="360" y1="100" x2="220" y2="343"/><line x1="392" y1="118" x2="252" y2="361"/><line x1="426" y1="140" x2="284" y2="386"/><line x1="460" y1="162" x2="318" y2="408"/><line x1="494" y1="185" x2="352" y2="431"/><line x1="522" y1="200" x2="380" y2="446"/>
</g>
<!-- reflected light converging on the strip 0.8 m under F -->
<g stroke="#f6ad55" stroke-width="1.5" stroke-dasharray="4 3">
  <line x1="190" y1="325" x2="376" y2="222"/><line x1="220" y1="343" x2="376" y2="222"/><line x1="252" y1="361" x2="376" y2="222"/><line x1="318" y1="408" x2="376" y2="222"/><line x1="352" y1="431" x2="376" y2="222"/><line x1="380" y1="446" x2="376" y2="222"/>
</g>
<!-- style: the focal tube, ground to just under F; the light goes down inside it -->
<rect x="389" y="234" width="22" height="326" fill="#2f855a"/>
<rect x="395" y="222" width="10" height="440" fill="#6b46c1" opacity="0.5"/>
<!-- corolla: the bowl, perpendicular to the sun line, 2.1 m each side of the vertex, concave to the sun -->
<path d="M 171 325 Q 264 416 389 451" fill="none" stroke="#d69e2e" stroke-width="9" stroke-linecap="round"/>
<path d="M 171 325 Q 264 416 389 451" fill="none" stroke="#f6e05e" stroke-width="3" stroke-linecap="round"/>
<circle cx="171" cy="325" r="7" fill="#d69e2e"/><circle cx="389" cy="451" r="7" fill="#d69e2e"/>
<!-- motor cells: the fine stage between the bowl's back and the frame -->
<g stroke="#15803d" stroke-width="3">
  <line x1="205" y1="352" x2="196" y2="368"/><line x1="271" y1="404" x2="262" y2="420"/><line x1="343" y1="440" x2="334" y2="456"/>
</g>
<!-- calyx: the back frame 0.6 m behind the vertex and the side arm from the trunnion (behind the page plane) -->
<path d="M 171 367 Q 262 445 353 471" fill="none" stroke="#6b8e23" stroke-width="4"/>
<line x1="400" y1="180" x2="262" y2="419" stroke="#6b8e23" stroke-width="4" stroke-dasharray="7 5"/>
<!-- turgor: the arm continues 2.6 m up the sun line to the water tank; the jack from the post to the crank -->
<line x1="400" y1="180" x2="478" y2="45" stroke="#2b6cb0" stroke-width="4"/>
<ellipse cx="470" cy="59" rx="12" ry="22" transform="rotate(30 470 59)" fill="#2b6cb0"/>
<line x1="400" y1="180" x2="459" y2="190" stroke="#2b6cb0" stroke-width="3"/>
<line x1="455" y1="345" x2="459" y2="190" stroke="#2b6cb0" stroke-width="3"/>
<!-- stalk: the two posts (one behind the other, 3.6 m to either side of the style) from the ring beam to the axis -->
<ellipse cx="400" cy="560" rx="216" ry="26" fill="none" stroke="#276749" stroke-width="4"/>
<rect x="459" y="201" width="22" height="359" fill="#276749"/>
<!-- pulvinus: the trunnion blocks on the elevation axis (a point in this view, at F) -->
<circle cx="400" cy="180" r="16" fill="#dd6b20"/>
<g stroke="#ffffff" stroke-width="1.6"><line x1="390" y1="170" x2="410" y2="190"/><line x1="410" y1="170" x2="390" y2="190"/></g>
<!-- stigma: the strip under F and F itself -->
<circle cx="376" cy="222" r="7" fill="#6b46c1"/><circle cx="400" cy="180" r="4" fill="#6b46c1"/>
<!-- heliotropism arrow about F -->
<path d="M 330 130 A 80 80 0 0 1 470 130" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#ar)"/>
<!-- roots -->
<g stroke="#7c4a1e" stroke-width="3" stroke-linecap="round" fill="none">
  <path d="M 389 560 Q 340 600 300 640"/><path d="M 411 560 Q 460 610 500 630"/><path d="M 400 560 L 400 610"/><path d="M 350 600 Q 320 620 290 616"/>
</g>
<!-- ovary: the pot, inferior, below the ground -->
<rect x="370" y="650" width="60" height="70" rx="14" fill="#9b2c2c"/>
<circle cx="400" cy="656" r="16" fill="#ffffff" stroke="#9b2c2c" stroke-width="3"/>
<!-- labels -->
<g fill="#374151">
  <text x="640" y="106" text-anchor="middle" font-weight="600">the sun, el 60</text>
  <text x="445" y="36" text-anchor="end">turgor: 91 L of water 2.6 m up each arm</text>
  <text x="445" y="52" text-anchor="end">balances the head about the axis;</text>
  <text x="445" y="68" text-anchor="end">pumping 46 L trims it against the mean wind</text>
  <text x="130" y="140" text-anchor="end">heliotropism: the head turns about F,</text>
  <text x="130" y="156" text-anchor="end">on the ring (azimuth, 220 deg) and</text>
  <text x="130" y="172" text-anchor="end">the trunnions (elevation, 71 deg)</text>
  <text x="472" y="150">pulvinus: the two trunnion blocks,</text>
  <text x="472" y="166">3.25 m to either side on this axis</text>
  <text x="300" y="255" text-anchor="end">stigma: the strip 0.8 m under F;</text>
  <text x="300" y="271" text-anchor="end">nothing else stands in the light</text>
  <text x="130" y="300" text-anchor="end">corolla: the bowl, membrane</text>
  <text x="130" y="316" text-anchor="end">and rim, a 2.1 m, R 8.2 m</text>
  <text x="130" y="380" text-anchor="end">motor cells: three blades and</text>
  <text x="130" y="396" text-anchor="end">three water columns, 62 urad per mL</text>
  <text x="130" y="440" text-anchor="end">calyx: the frame behind the bowl</text>
  <text x="130" y="456" text-anchor="end">and the arms beside it (dashed:</text>
  <text x="130" y="472" text-anchor="end">2.45 m outside the page plane)</text>
  <text x="492" y="222">stalk: the posts, 3.6 m to either</text>
  <text x="492" y="238">side of the style, from the ring</text>
  <text x="492" y="254">beam on the deck rail</text>
  <text x="492" y="296">the jack on its crank holds the</text>
  <text x="492" y="312">elevation; self-locking, no power</text>
  <text x="300" y="500" text-anchor="end">style: the focal tube, up the</text>
  <text x="300" y="516" text-anchor="end">middle of the bowl through its</text>
  <text x="300" y="532" text-anchor="end">hole and slot, the light inside it</text>
  <text x="640" y="604">roots: the deck and its ring rail</text>
  <text x="445" y="690">ovary and fruit: the tandoor pot,</text>
  <text x="445" y="706">inferior, below the deck</text>
</g>
<g stroke="#9ca3af" stroke-width="1">
  <line x1="135" y1="296" x2="170" y2="320"/><line x1="135" y1="378" x2="200" y2="360"/><line x1="135" y1="438" x2="176" y2="380"/><line x1="135" y1="150" x2="330" y2="130"/>
  <line x1="305" y1="252" x2="370" y2="226"/><line x1="440" y1="686" x2="430" y2="670"/><line x1="450" y1="48" x2="462" y2="56"/><line x1="468" y1="158" x2="416" y2="178"/>
  <line x1="305" y1="497" x2="388" y2="480"/><line x1="488" y1="224" x2="481" y2="230"/><line x1="488" y1="300" x2="460" y2="300"/><line x1="636" y1="598" x2="590" y2="578"/>
</g>
</g>
<text x="20" y="756" fill="#6b7280" font-size="11">Side view along the elevation axis at spring noon; the two posts, arms, blocks and tanks stand one behind the other, 3.6 m and 2.45 m to either side of the tube.</text>
<text x="20" y="772" fill="#6b7280" font-size="11">Heliotropic bowl flowers (Arctic poppy, Dryas) track the sun and warm the gynoecium at the bowl's focus (Kevan 1975, Science 189:723); a pulvinus tilts a leaf by</text>
<text x="20" y="788" fill="#6b7280" font-size="11">moving water between its cells; the sunflower's ovary is inferior, below the corolla.</text>
</svg>

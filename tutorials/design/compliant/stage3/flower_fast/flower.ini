[base]
package = tandoor
env_name = puffer_flower
policy_name = Policy
rnn_name = Recurrent

[vec]
backend = Serial
num_envs = 1

[env]
wind_from = S
wind_scale = 1.0

; ---- THE MOUNT. The flower's mechanism, solved every step (tandoor_flower_env.py).
; base: 'ring' puts the pedicel's foot on a carriage running a rail round the light pipe; 'stem' is the register's fixed
;   mast on the deck. The choice is not cosmetic: measured over the year against THIS env's aim law, a fixed stem needs a
;   0.18-8.56 m boom (48:1, not a telescope) while the carriage needs 1.09-2.80 m (2.6:1, one stage) - and a short boom is
;   also a stiff one, 9 um of image per N at 2.8 m against 60 um/N at 7.4.
base = stem
; THE BOOM'S COMPLIANCE, MEASURED (design/compliant/stage3/boom/: pivot2.py, tipmoment.py; 170 poses, gains taken about the
; boom's TIP, the vertex riding D_REC = 1.8 m in front of it). The walk is the SIGNED g_rot*theta + g_tr*delta and the
; two gains do have opposite signs at every pose - but the neutral point they define sits 1.9 m below the boom root in
; the median and wanders from -0.9 to +7.2 m over the year, so no passive centre, tube taper or root pivot can sit on
; it (best pivot anywhere on the stem line: 1.02-1.14x). The stem's own bending is already near-inert (a rigid boom
; would cut the walk 3.2x); the boom's bending IS the walk, and only stiffness moves it (2x EI 1.56x, 4x 2.14x). The
; 'reversed' telescope that once measured 2.4x was stiffness in disguise - an arm 45x stiffer - and its soft root runs
; 443-3268 MPa at the 15 m/s tracking limit against 438 allowed. kind stays uniform; ratio/root are inert unless
; kind = reversed. As built, with the drag's own tip moment: 6.34 um/N over the year.
boom_kind = uniform
boom_ratio = 45.0
boom_root = 0.25
; ring_r 4 m, not 3: at r 3 the stroke is prettier still (1.8:1) but the boom passes through the head's own aperture on
; 50 % of the year's poses. At r 4 that is 0.0 %, checked pose by pose. The mount must not reach through its own mirror.
; ring_r is inert with base = stem: there is no carriage and no joint 0, the stem top is fixed
ring_r = 4.0
stem_z = 1.0
; boom_min/boom_max default to the measured envelope of the chosen base; set them to force a machine and watch it saturate.
; stow_wind: track to this mean wind, park face-up above it (3 m/s of hysteresis), as tree/out/wind_size.txt decided.
stow_wind = 15.0
; fine_stage: the six crown struts as the fast stage, +-50 mm of stroke at an 8 Hz loop. Off, only the pedicel's own 0.5 Hz
; loop answers the gust and the image walks about 5x further.
fine_stage = 1
; mech: 0 falls back to the old lumped model (one constant um/N, no joints, no limits, no stow).
mech = 1
; two_tier_beta: let the mount raise beta where it runs out of reach. OFF by default - the kernel owns the beta schedule and
; has its own two branches, and the two fight (measured: a step-by-step limit cycle in the boom's demand).
two_tier_beta = 0
gpu = 1
day_random = 1
lat_random = 1
device = mps
n_rays = 512
num_agents = 8192
g_orbit = 4 
n_zones = 5
zone_c = 0.4
; deck_h left UNSET, so z_deck falls back to Z_ROOF: the machine stands on the roof itself, not on a platform
; 1.40 m above it. The raised deck was costing 17.6 % of the year - the receptacle sits 1.8 m behind the vertex and
; dropped BELOW the deck whenever the head looked steeply up. Standing on the roof it clears every pose, and the ring
; carriage's link stops telescoping altogether (2.50 m constant, stroke 1.0x, measured over 170 poses).
; It also brings F down with it: z_fold = z_deck + 0.35 + the dish's 4.518 m under-swing.
; deck_h = 4.0
nurbs = 1
wide_shutter = 1
warm_frac = 0.0
wall_obs = 1
flare_ratio = 1.4
flare_reflect = 0.6
; beta_dev 0: RETRO. The 36 was the cass machine's traced optimum (old deck, tower in the sun's line, retro -30 %). On THIS
; machine the env's own trace runs monotonically to retro (stage3/tree/out/beta_tri_memo.md): 36 delivers 2.36 / 3.17 / 2.38 kW
; against 5.82 / 7.78 / 7.65 at retro, midwinter / equinox / midsummer - the strip shades 8 % either way and every cost of
; beta lands on the reflected leg. Two things the trace does NOT see at retro: with the sun above ~41 deg the dish stands on
; the axis under F, in the strip's down-beam, and this dish has no hole; and nothing above the deck is shaded but the arm.
beta_dev = 0.0
beta_cap_z = 10.6
silvered = 1
duct_nozzle = 2
spot_bread = 1
elbow_aim = 1
load_ctrl = 1
roti_kj = 130.0
bread_area = 0.12
loaves_per_load = 8
reward_div = 75.0
sticky_k = 1
; the THREE-MIRROR machine: dish -> hyperboloid strip at F -> bore -> actuated M3 straight at the bread.
; No elbow. elbow_aim stays 1 because on tri that head turns M3 instead - it is M3's aim, not an elbow.
receiver = tri
; post_offset 0: F stands DIRECTLY ABOVE M3 and the bore is vertical. The stock 0.5 m tilted the bore 2.94 deg, and it
; was kept for a -4 %/yr measurement made at beta 36 on the old deck. Re-traced on this machine (roof deck, tri, r_duct
; 0.55; stage3/tree/strip_grid.py): vertical is 5.85 / 7.77 / 8.06 kW against 5.82 / 7.78 / 7.65 at retro (+0.5 / 0 / +5 %)
; and 2.70 / 3.14 / 2.33 against 2.36 / 3.17 / 2.38 at beta 36 (+14 / -1 / -2 %), midwinter / equinox / midsummer.
post_offset = 0.0
; d_strip 0.3: the strip's vertex 0.3 m below F instead of 0.6 (magnification 26.8, not 12.9). At retro the beam down the bore
; is then a 0.3 m near-parallel tube (rays 2.4 deg to the axis) and the trace with the sun's disc on delivers the same power
; (7.86 vs 7.89 kW, equinox); the strip itself is half the size. Only at retro: at beta 36 the same move halves the power.
d_strip = 0.3
; tri needs a wide inlet: at 0.40 the hole clips a third of the power (hashemi_tri.ini)
r_duct = 0.55
r_m4 = 1.3
night_carry = 1
wall = ifb
insulation = 1
cut_penalty = 75.0
lost_deg = 5.0
enc_clamp = 6.0

[policy]
hidden_size = 256

[rnn]
input_size = 256
hidden_size = 256

[train]
device = mps
optimizer = muon
total_timesteps = 1500_000_000
anneal_lr = True

learning_rate = 0.003
gamma = 0.995
gae_lambda = 0.923
adam_beta1 = 0.98
ent_coef = 0
clip_coef = 0.1
minibatch_size = 65536
bptt_horizon = 512
max_grad_norm = 3.25
checkpoint_interval = 20
compile = False
prio_alpha = 0.7

[sweep]
method = Protein
metric = rotis_per_hour
goal = maximize
downsample = 10

; ONE architecture dim: the GP samples the encoder width; rnn
; input_size and hidden_size are TIED to it by the sweep runner
; (modal_sweep.run_sweep DERIVED table) because the matmuls demand
; it - encoder out feeds LSTM in, LSTM out feeds the decoder.
; (This replaces the 'distribution = sweep.policy.hidden_size'
; reference syntax, which pufferlib's parser cannot express.)
; pow2 up to 2048: a 16384-wide LSTM probe would run ~1e2 slower
; than it learns - raise the cap deliberately, not by typo.
[sweep.policy.hidden_size]
distribution = uniform_pow2
min = 64
max = 2048
mean = 256
scale = auto

; PIN, do not delete: default.ini SWEEPS vec.num_envs, and the fast
; collect (plus the 8192-tandoors-in-one-env design) requires ONE
; native vec env. min == max = pinned (the sweep patch skips it).
[sweep.vec.num_envs]
distribution = uniform_pow2
min = 1
max = 1
mean = 1
scale = auto

; probe-length mean halved: everything decisive locally (climb,
; plateau, walk-onset) happens by ~300M; longer probes buy little
; ranking signal and n_rays=512 makes each step pricier than the
; 64-ray sweeps this budget was set for
[sweep.train.total_timesteps]
distribution = log_normal
min = 3e8
max = 3e9
mean = 5e8
scale = time

; lr prior recentered for MUON (fixed-norm updates: lr IS the step
; size). Proven points: 0.01 blitzes bootstrap but walks off the
; plateau; 0.005 climbs tamely (kl 0.003). Mean sits between.
[sweep.train.learning_rate]
distribution = log_normal
min = 0.001
max = 0.02
mean = 0.005
scale = 0.5

; ent recentered on the no-bonus regime: every sweep run at
; ent>=0.01 scored zero; the local 110/day climbs ran ent 0-1e-5.
; With muon at the plateau an entropy bonus is a decommitment
; force (it wins tugs-of-war against zero-mean advantage noise).
[sweep.train.ent_coef]
distribution = log_normal
min = 0.000001
max = 0.003
mean = 0.00003
scale = auto

[sweep.train.gamma]
distribution = logit_normal
min = 0.99
max = 0.9995
mean = 0.995
scale = auto

[sweep.train.gae_lambda]
distribution = logit_normal
min = 0.90
max = 0.98
mean = 0.928
scale = auto

; bptt mean moved to the measured winner: the only sweep dim with a
; clean 2x effect (runs 10/11, bptt=512, doubled every bptt<=256
; run), and the local 110/day config trains at 512.
[sweep.train.bptt_horizon]
distribution = uniform_pow2
min = 128
max = 1024
mean = 512
scale = auto

; NEW: engagement latch period (env). 0/off is known-dead (cooks
; vanish from sampled data); the local proven point is 8. Sweep the
; commitment-vs-reaction tradeoff around it.
[sweep.env.sticky_k]
distribution = uniform_pow2
min = 4
max = 32
mean = 8
scale = auto

; ---- PINS: default.ini silently sweeps ALL of these; their sweep
; centers are NOT our proven config (ent 0.01 vs 0.0029 pinned
; entropy at the ceiling for 780M steps; prio_beta0 0.85 vs 0.2,
; grad norm 1.0 vs 3.25, adam retuned). min == max = pinned (the
; sweep patch skips it and the ini base value holds).
[sweep.train.minibatch_size]
distribution = uniform
min = 65536
max = 65536
mean = 65536
scale = auto

[sweep.train.vtrace_rho_clip]
distribution = uniform
min = 1.0
max = 1.0
mean = 1.0
scale = auto

[sweep.train.vtrace_c_clip]
distribution = uniform
min = 1.0
max = 1.0
mean = 1.0
scale = auto

; UNPINNED: the per-epoch movement fence is now a first-class
; stability knob (muon walks at the plateau; the fence caps each
; epoch's drift). Local runs: 0.2 yanked, 0.1 climbed orderly.
[sweep.train.clip_coef]
distribution = logit_normal
min = 0.05
max = 0.3
mean = 0.1
scale = auto

[sweep.train.vf_clip_coef]
distribution = uniform
min = 0.2
max = 0.2
mean = 0.2
scale = auto

[sweep.train.vf_coef]
distribution = uniform
min = 2.0
max = 2.0
mean = 2.0
scale = auto

[sweep.train.max_grad_norm]
distribution = uniform
min = 3.25
max = 3.25
mean = 3.25
scale = auto

; muon momentum EMA (heavyball reuses the adam beta names): pinned
; at the local operating point - longer EMA cancels more plateau
; noise before orthogonalization
[sweep.train.adam_beta1]
distribution = uniform
min = 0.98
max = 0.98
mean = 0.98
scale = auto

[sweep.train.adam_beta2]
distribution = uniform
min = 0.999
max = 0.999
mean = 0.999
scale = auto

[sweep.train.adam_eps]
distribution = uniform
min = 1e-12
max = 1e-12
mean = 1e-12
scale = auto

; UNPINNED, centered LOW: prio resamples the same tail segments all
; epoch, giving plateau noise a consistent direction that survives
; muon's momentum and becomes a full-norm step - the measured drift
; that killed three local runs. alpha=0 (uniform minibatches) is
; the local operating point; let the GP price the tradeoff.
[sweep.train.prio_alpha]
distribution = uniform
min = 0.0
max = 0.8
mean = 0.2
scale = auto

[sweep.train.prio_beta0]
distribution = uniform
min = 0.2
max = 0.2
mean = 0.2
scale = auto


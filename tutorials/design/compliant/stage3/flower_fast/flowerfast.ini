; The flower's OWN inner loop: a standalone policy at 1 kHz, driving the flower's own actuators, seeing a flux camera
; at the fold, on Hashemi's reward and Hashemi's membrane actuation.  tandoor_flower_fast.py has the physics.
;
;     puffer train puffer_flower_fast
;
; This is NOT a warm start from any Hashemi checkpoint and cannot be: the action space is the flower's actuators, not
; his two motors, and the observation is an image, not his 68 scalars. It is the other half of the machine - his policy
; owns the day at 15 s, this one owns the gust at 1 ms - and it is the half that is meant to end up on an ESP32.
[base]
package = tandoor
env_name = puffer_flower_fast
policy_name = FluxConv
rnn_name = Recurrent

[vec]
backend = Serial
num_envs = 1

[env]
; ---- the loop
; return device tensors: the numpy copy of a 24x24 frame per agent per ms is the whole budget
on_device = 1
; the flux camera: 24 x 24, 8 bits. Small on purpose - this has to run on an ESP32 at 1 kHz.
cam_n = 24
cam_bits = 8
; shot noise on the signal, read noise on the floor. 0 gives a policy that trusts a clean frame.
cam_noise = 1.0
; the short tail after the image: joint encoders, fine stage, plenum. No camera sees the joints.
obs_proprio = 1
; 8000 steps of wind per episode
episode_s = 8.0
; measured 582k agent-steps/s at this batch: the env is launch-bound, so the batch is nearly free
num_agents = 8192
; hold the mean wind and let the gust do the work; raise it to make the loop earn its keep
wind_mean = 9.0
wind_scale = 1.0

; ---- the mount (tandoor_flower_env.py chose these by running the mechanism over the year)
base = ring
ring_r = 4.0
stem_z = 2.5
fine_stage = 1
mech = 1
stow_wind = 15.0

; ---- the machine, as hashemi.ini has it
gpu = 1
device = mps
; the fast env does not ray-trace: the kernel is built once and never stepped, so keep it cheap
n_rays = 64
day_random = 1
lat_random = 0
g_orbit = 4
a_mem = 2.1
n_zones = 5
zone_c = 0.4
deck_h = 4.0
wide_shutter = 1
warm_frac = 0.0
wall_obs = 1
; the traced optimum (beta_flux.py): about a third more power than retro; flower.ini still runs 0
beta_dev = 36.0
beta_cap_z = 10.6
silvered = 1
duct_nozzle = 2
spot_bread = 1
elbow_aim = 1
load_ctrl = 1
roti_kj = 130.0
bread_area = 0.12
loaves_per_load = 8
; post_offset: F stands this far north of the wall tower. The bore runs F -> P4 with P4 fixed over the chase, so
; this offset TILTS the bore rather than sliding it: 0.5 m gives 2.94 deg and puts F 0.71 bore radii off the borehole's
; axis. It is kept at the stock 0.5 because it buys LOW SUN - it is what lets the dish's high-sun swing clear the wall
; tower. Straightening it was measured and costs more than it is worth (midwinter / equinox / midsummer, traced):
;    post_offset 0.5, tilt 2.94 deg :  1.374 / 2.722 / 3.846 kW
;    post_offset 0.0, tilt 0.00 deg :  1.116 / 2.608 / 3.897 kW   -18.8 % / -4.2 % / +1.3 %, about -4 % on the year
post_offset = 0.5
receiver = cass
r_m4 = 1.3
; 1, not 75: the reward is already Hashemi's own weights x dt/15, so a step pays about 1e-4 and
reward_div = 1.0
                         ; the trainer's +-1 clamp is nowhere near binding. Dividing again would bury it in the noise.

[policy]
; the conv encoder is two strided convolutions and a linear - about 30 k parameters
hidden_size = 128

[rnn]
input_size = 128
hidden_size = 128

[train]
device = mps
optimizer = muon
total_timesteps = 2_000_000_000
anneal_lr = True
learning_rate = 0.003
; gamma 0.999 at 1 kHz is a 1 s horizon. Hashemi's 0.995 would be 200 ms here - shorter than one gust - and the policy
; would never see the ring-down it is being asked to damp.
gamma = 0.999
gae_lambda = 0.95
adam_beta1 = 0.98
ent_coef = 0
clip_coef = 0.1
minibatch_size = 65536
; 256 ms of history: past the boom's 2-7 Hz mode and into the gust band
bptt_horizon = 256
max_grad_norm = 3.25
checkpoint_interval = 20
compile = False
prio_alpha = 0.7

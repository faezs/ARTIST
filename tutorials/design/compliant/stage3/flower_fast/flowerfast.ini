; The flower's OWN inner loop: a standalone policy at 1 kHz, driving the flower's own actuators, seeing a flux camera
; at the fold, on Hashemi's reward and Hashemi's membrane actuation.  tandoor_flower_fast.py has the physics.
;
;     puffer train puffer_flower_fast
;
; This is NOT a warm start from any Hashemi checkpoint and cannot be: the action space is the flower's actuators, not
; his two motors, and the observation is an image, not his 68 scalars. It is the other half of the machine - his policy
; owns the day at 15 s, this one owns the gust at 1 ms - and it is the half that is meant to end up on an ESP32.
[base]
package = tandoor
env_name = puffer_flower_fast
policy_name = FluxConv
rnn_name = Recurrent

[vec]
backend = Serial
num_envs = 1

[env]
; ---- the loop
; return device tensors: the numpy copy of a 24x24 frame per agent per ms is the whole budget
on_device = 1
; the flux camera: 24 x 24, 8 bits. Small on purpose - this has to run on an ESP32 at 1 kHz.
cam_n = 24
cam_bits = 8
; shot noise on the signal, read noise on the floor. 0 gives a policy that trusts a clean frame.
cam_noise = 1.0
; the short tail after the image: joint encoders, fine stage, plenum. No camera sees the joints.
obs_proprio = 1
; THE FAST LOOP'S OWN JOB: only the crown's three fine-stage heads, paid -|image miss at F| per step (one at 0.20 m). The
; pedicel, the plenum level and the valve stay at neutral for the 15 s policy. On Hashemi's cooking reward (3e-7 a step) the
; policy stayed uniform random after 240 epochs and walked the image 20 cm off. reward = hashemi, fine_only = 0 restore that.
fine_only = 1
reward = miss
miss_scale = 0.20
; the camera looks at F, the plane the reward is paid on; at the receiver a miss at F moves the frame 0.0005 px a millimetre
cam_plane = F
; 8000 steps of wind per episode
episode_s = 8.0
; measured 582k agent-steps/s at this batch: the env is launch-bound, so the batch is nearly free
num_agents = 8192
; hold the mean wind and let the gust do the work; raise it to make the loop earn its keep
; wind_mean = 9.0   (a fixed mean overrides the site's day; the site's working-day mean is 1.9 m/s, its 99 % 5.2)
wind_scale = 1.0
; THE REAL WIND: a recorded day at the site (ERA5 at Quetta, tandoor_site_wind.npz) within 15 days of the episode's day,
; read at the episode's hour: speed, direction and gustiness. wind_from is the fixed bearing used when wind_site is 0.
wind_site = 1
wind_from = W

; ---- the mount (tandoor_flower_env.py chose these by running the mechanism over the year)
base = stem
; THE BOOM'S COMPLIANCE, MEASURED (design/compliant/stage3/boom/: pivot2.py, tipmoment.py; 170 poses, gains taken about the
; boom's TIP, the vertex riding D_REC = 1.8 m in front of it). The walk is the SIGNED g_rot*theta + g_tr*delta and the
; two gains do have opposite signs at every pose - but the neutral point they define sits 1.9 m below the boom root in
; the median and wanders from -0.9 to +7.2 m over the year, so no passive centre, tube taper or root pivot can sit on
; it (best pivot anywhere on the stem line: 1.02-1.14x). The stem's own bending is already near-inert (a rigid boom
; would cut the walk 3.2x); the boom's bending IS the walk, and only stiffness moves it (2x EI 1.56x, 4x 2.14x). The
; 'reversed' telescope that once measured 2.4x was stiffness in disguise - an arm 45x stiffer - and its soft root runs
; 443-3268 MPa at the 15 m/s tracking limit against 438 allowed. kind stays uniform; ratio/root are inert unless
; kind = reversed. As built, with the drag's own tip moment: 6.34 um/N over the year.
boom_kind = uniform
boom_ratio = 45.0
boom_root = 0.25
; ring_r is inert with base = stem: there is no carriage and no joint 0, the stem top is fixed
ring_r = 4.0
stem_z = 1.0
fine_stage = 1
mech = 1
stow_wind = 15.0

; ---- the machine, as hashemi.ini has it
gpu = 1
device = mps
; the fast env DOES ray-trace every step (the flux camera is the megakernel's landing points; trace_setup/trace): n_rays is
; the rays per agent per millisecond, 64 measured at 2.1 M agent-steps/s
n_rays = 64
day_random = 1
lat_random = 0
g_orbit = 4
a_mem = 2.1
n_zones = 5
zone_c = 0.4
; deck_h left UNSET, so z_deck falls back to Z_ROOF: the machine stands on the roof itself, not on a platform
; 1.40 m above it. The raised deck was costing 17.6 % of the year - the receptacle sits 1.8 m behind the vertex and
; dropped BELOW the deck whenever the head looked steeply up. Standing on the roof it clears every pose, and the ring
; carriage's link stops telescoping altogether (2.50 m constant, stroke 1.0x, measured over 170 poses).
; It also brings F down with it: z_fold = z_deck + 0.35 + the dish's 4.518 m under-swing.
; deck_h = 4.0
wide_shutter = 1
warm_frac = 0.0
wall_obs = 1
; beta_dev 0: RETRO. The 36 was the cass machine's traced optimum (old deck, tower in the sun's line, retro -30 %). On THIS
; machine the env's own trace runs monotonically to retro (stage3/tree/out/beta_tri_memo.md): 36 delivers 2.36 / 3.17 / 2.38 kW
; against 5.82 / 7.78 / 7.65 at retro, midwinter / equinox / midsummer - the strip shades 8 % either way and every cost of
; beta lands on the reflected leg. Two things the trace does NOT see at retro: with the sun above ~41 deg the dish stands on
; the axis under F, in the strip's down-beam, and this dish has no hole; and nothing above the deck is shaded but the arm.
beta_dev = 0.0
beta_cap_z = 10.6
silvered = 1
duct_nozzle = 2
spot_bread = 1
elbow_aim = 1
load_ctrl = 1
roti_kj = 130.0
bread_area = 0.12
loaves_per_load = 8
; post_offset 0: F stands DIRECTLY ABOVE M3 and the bore is vertical. The stock 0.5 m tilted the bore 2.94 deg, and it
; was kept for a -4 %/yr measurement made at beta 36 on the old deck. Re-traced on this machine (roof deck, tri, r_duct
; 0.55; stage3/tree/strip_grid.py): vertical is 5.85 / 7.77 / 8.06 kW against 5.82 / 7.78 / 7.65 at retro (+0.5 / 0 / +5 %)
; and 2.70 / 3.14 / 2.33 against 2.36 / 3.17 / 2.38 at beta 36 (+14 / -1 / -2 %), midwinter / equinox / midsummer.
post_offset = 0.0
; d_strip 0.3: the strip's vertex 0.3 m below F instead of 0.6 (magnification 26.8, not 12.9). At retro the beam down the bore
; is then a 0.3 m near-parallel tube (rays 2.4 deg to the axis) and the trace with the sun's disc on delivers the same power
; (7.86 vs 7.89 kW, equinox); the strip itself is half the size. Only at retro: at beta 36 the same move halves the power.
d_strip = 0.3
; the THREE-MIRROR machine: dish -> hyperboloid strip at F -> bore -> actuated M3 straight at the bread.
; No elbow. elbow_aim stays 1 because on tri that head turns M3 instead - it is M3's aim, not an elbow.
receiver = tri
; tri needs a wide inlet: at 0.40 the hole clips a third of the power (hashemi_tri.ini)
r_duct = 0.55
r_m4 = 1.3
; 1, not 75: the reward is already Hashemi's own weights x dt/15, so a step pays about 1e-4 and
reward_div = 1.0
                         ; the trainer's +-1 clamp is nowhere near binding. Dividing again would bury it in the noise.

[policy]
; the conv encoder is two strided convolutions and a linear; ch = the two widths. (8, 16), not (16, 32): the convolution's
; backward on MPS is 56 ms a 32768-frame minibatch at (8, 16) and 215 at (16, 32), and it was the learn phase's whole cost.
hidden_size = 128
ch = 8,16

[rnn]
input_size = 128
hidden_size = 128

[train]
device = mps
optimizer = muon
; 300 M: at ~35 K steps/s the trainer takes 2.4 h; the fine-stage task is small and should show itself well inside that
total_timesteps = 300_000_000
anneal_lr = True
learning_rate = 0.003
; gamma 0.999 at 1 kHz is a 1 s horizon. Hashemi's 0.995 would be 200 ms here - shorter than one gust - and the policy
; would never see the ring-down it is being asked to damp.
gamma = 0.999
gae_lambda = 0.95
adam_beta1 = 0.98
ent_coef = 0
clip_coef = 0.1
minibatch_size = 65536
; 256 ms of history: past the boom's 2-7 Hz mode and into the gust band
bptt_horizon = 256
max_grad_norm = 3.25
checkpoint_interval = 20
compile = False
; 0, not 0.7: with 8192 agents x 256 steps a rollout is 2.1 M samples and the prioritised minibatch sort was 77 % of the wall
; clock (Learn/Misc on the dashboard; the env itself 12 %). Uniform minibatches are the hashemi runs' operating point too.
prio_alpha = 0.0
